    const CIRCUMFERENCE = 2 * Math.PI * 52;

    // ========== Storage ==========
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function safeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

    // ========== Language ==========
    let lang = 'en';
    function t(key, vars) {
      const d = I18N[lang];
      let s = (d && d[key] != null) ? d[key] : I18N.en[key];
      if (s == null) s = key;
      if (vars) s = s.replace(/\{(\w+)\}/g, function (m, n) { return vars[n] != null ? vars[n] : m; });
      return s;
    }

    // ========== Native bridge (Android wrapper) ==========
    const NATIVE = (window.AndroidStep) ? window.AndroidStep : null;
    const NATIVE_V2 = !!(NATIVE && typeof NATIVE.drain === 'function' && typeof NATIVE.setParams === 'function');

    // ========== Step Engine ==========
    const Engine = (function () {
      const subs = new Set();
      let motionOn = false, useNative = false, gotData = false;
      let watchdog = null, pollTimer = null;

      let g = null, tPrev = 0, f = 0, f1 = 0, f2 = 0, rv = 0, rh = 0;
      let valley = 0, env = 0, lastPeakT = -1e9;
      let cands = [], confirmed = false, lastStepT = -1e9;

      function resetDetect() {
        g = null; tPrev = 0; f = f1 = f2 = 0; rv = rh = 0;
        valley = 0; env = 0; lastPeakT = -1e9;
        cands = []; confirmed = false; lastStepT = -1e9;
      }
      function readSlider(el, def) {
        const v = el ? Number(el.value) : def;
        return (isFinite(v) ? Math.min(100, Math.max(0, v)) : def) / 100;
      }
      // higher filter = stricter, lower sensitivity = stricter. Same numbers are sent to the Android service.
      function params() {
        const vF = readSlider(vertFilter, 50), hF = readSlider(horizFilter, 40), sn = readSlider(sensitivity, 60);
        return { minInt: 220 + vF * 120, maxPeak: 30 - vF * 22, hLimit: 3.2 - hF * 2.4, thr: 2.2 - sn * 1.6 };
      }
      function pushParams() {
        if (!NATIVE_V2) return;
        const p = params();
        try { NATIVE.setParams(p.minInt, p.maxPeak, p.hLimit, p.thr); } catch (e) {}
      }
      function emit(n, ts, before) {
        Array.from(subs).forEach(function (sub) { try { sub.onSteps(n, ts, before || 0); } catch (e) {} });
      }
      function regular(a) {
        const iv = [];
        for (let i = 1; i < a.length; i++) iv.push(a[i] - a[i - 1]);
        let mean = 0; iv.forEach(function (x) { mean += x; }); mean /= iv.length;
        if (mean < 250 || mean > 1500) return false;
        let sd = 0; iv.forEach(function (x) { sd += (x - mean) * (x - mean); });
        sd = Math.sqrt(sd / iv.length);
        return sd / mean < 0.35;
      }
      function onStep(tm) {
        if (tm - lastStepT > 2000) { confirmed = false; cands.length = 0; }
        lastStepT = tm;
        if (confirmed) { emit(1, [tm]); return; }
        cands.push(tm);
        while (cands.length && tm - cands[0] > 4000) cands.shift();
        if (cands.length >= 4 && regular(cands.slice(-4))) {
          const ts = cands.slice();
          confirmed = true; cands.length = 0;
          emit(ts.length, ts);
        }
      }
      function detect(x, y, z, tm) {
        if (g === null) { g = [x, y, z]; tPrev = tm; return; }
        const dt = (tm - tPrev) / 1000;
        tPrev = tm;
        if (dt <= 0) return;
        if (dt > 0.5) { resetDetect(); g = [x, y, z]; tPrev = tm; return; }
        const kg = dt / (1.0 + dt);
        g[0] += kg * (x - g[0]); g[1] += kg * (y - g[1]); g[2] += kg * (z - g[2]);
        const gm = Math.sqrt(g[0] * g[0] + g[1] * g[1] + g[2] * g[2]) || 9.81;
        const lx = x - g[0], ly = y - g[1], lz = z - g[2];
        const v = (lx * g[0] + ly * g[1] + lz * g[2]) / gm;
        const h2 = lx * lx + ly * ly + lz * lz - v * v;
        const h = h2 > 0 ? Math.sqrt(h2) : 0;
        const kr = dt / (1.5 + dt);
        rv += kr * (v * v - rv); rh += kr * (h * h - rh);
        const ks = dt / (dt + 0.032);
        f2 = f1; f1 = f; f += ks * (v - f);
        if (f < valley) valley = f;
        if (!(f2 < f1 && f1 >= f)) return;
        const tPeak = tm - dt * 1000;
        const prom = f1 - valley;
        valley = f;
        const p = params();
        if (tPeak - lastPeakT > 3000) env = 0;
        if (rv < 0.04) return;
        if (f1 > p.maxPeak) return;
        if (prom < p.thr) return;
        if (env > 0 && prom < 0.35 * env) return;
        if (Math.sqrt(rh / (rv + 1e-6)) > p.hLimit) return;
        if (tPeak - lastPeakT < p.minInt) return;
        env = env > 0 ? env * 0.8 + prom * 0.2 : prom;
        lastPeakT = tPeak;
        onStep(tPeak);
      }
      function onMotion(ev) {
        const a = ev.accelerationIncludingGravity;
        if (!a || a.x == null || a.y == null || a.z == null) return;
        gotData = true;
        detect(Number(a.x), Number(a.y), Number(a.z), performance.now());
      }
      function failAll(msg) {
        const list = Array.from(subs);
        subs.clear();
        end();
        list.forEach(function (sub) { try { sub.onFail(); } catch (e) {} });
        if (msg && !autoStarting) { try { alert(msg); } catch (e) {} }
      }
      async function beginMotion() {
        if (typeof DeviceMotionEvent === 'undefined') { failAll(t('motionUnavailable')); return; }
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          try {
            const r = await DeviceMotionEvent.requestPermission();
            if (r !== 'granted') { failAll(t('motionDenied')); return; }
          } catch (e) { failAll(t('motionPermErr')); return; }
        }
        if (!subs.size || motionOn) return;
        resetDetect(); gotData = false;
        window.addEventListener('devicemotion', onMotion);
        motionOn = true;
        watchdog = setTimeout(function () { if (!gotData) failAll(t('noMotionData')); }, 3000);
      }

      // ----- native (Android foreground service) -----
      function pollNative() {
        if (!useNative || !NATIVE_V2) return;
        let r = null;
        try { r = JSON.parse(NATIVE.drain()); } catch (e) { return; }
        if (!r) return;
        const n = Math.floor(Number(r.n)) || 0;
        if (n <= 0) return;
        const now = performance.now();
        const ts = (Array.isArray(r.ages) ? r.ages : []).map(function (a) { return now - Number(a); });
        emit(n, ts, Math.floor(Number(r.before)) || 0);
      }
      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(function () { if (!document.hidden) pollNative(); }, 1000);
      }
      function begin() {
        if (NATIVE_V2) {
          try {
            pushParams();
            NATIVE.start();
            useNative = true;
            startPolling();
            pollNative();
            return;
          } catch (e) { useNative = false; }
        } else if (NATIVE && typeof NATIVE.hasStepDetector === 'function') {
          // older wrapper apps: native step detector, steps arrive through window.__nativeSteps(n)
          let ok = false;
          try { ok = !!NATIVE.hasStepDetector(); } catch (e) {}
          if (ok) { try { NATIVE.start(); useNative = true; return; } catch (e) { useNative = false; } }
        }
        beginMotion();
      }
      function end() {
        if (useNative) { try { NATIVE.stop(); } catch (e) {} useNative = false; }
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (motionOn) { window.removeEventListener('devicemotion', onMotion); motionOn = false; }
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        resetDetect();
      }
      window.__nativeSteps = function (n) {
        n = Math.floor(Number(n));
        if (!isFinite(n) || n < 1 || n > 500) return;
        if (useNative) emit(n);
      };
      window.__nativeDenied = function () { if (useNative && subs.size) failAll(t('permDenied')); };
      window.__nativeError = function () {
        if (useNative && subs.size) {
          try { NATIVE.stop(); } catch (e) {}
          useNative = false;
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          beginMotion();
        }
      };
      return {
        start: function (sub) { subs.add(sub); if (subs.size === 1) begin(); },
        stop: function (sub) { subs.delete(sub); if (subs.size === 0) end(); },
        poll: pollNative,
        pushParams: pushParams,
        isNative: function () { return useNative; }
      };
    })();

    // ========== Step-length modes ==========
    const REF_CADENCE = 110, CAD_EXP = 0.6;
    let stepTimes = [], curCadence = 0;

    function trackCadence(ts, n) {
      const now = performance.now();
      if (ts && ts.length) { for (let i = 0; i < ts.length; i++) stepTimes.push(ts[i]); }
      else if (n === 1) stepTimes.push(now);
      else return;
      stepTimes.sort(function (a, b) { return a - b; });
      while (stepTimes.length && now - stepTimes[0] > 8000) stepTimes.shift();
      if (stepTimes.length >= 5) {
        const span = stepTimes[stepTimes.length - 1] - stepTimes[0];
        if (span >= 2000) {
          const c = (stepTimes.length - 1) / span * 60000;
          if (c >= 40 && c <= 220) curCadence = c;
        }
      }
    }
    function cadenceNow() {
      if (!stepTimes.length) return 0;
      return performance.now() - stepTimes[stepTimes.length - 1] < 3000 ? curCadence : 0;
    }
    function refCadence() {
      if (activeProfileId != null) {
        const p = profiles.find(function (x) { return String(x.id) === String(activeProfileId); });
        if (p && p.cadence) return p.cadence;
      }
      return REF_CADENCE;
    }
    function lengthRatio(c) {
      if (lengthMode === 'fixed' || !c) return 1;
      let r = Math.pow(c / refCadence(), CAD_EXP);
      r = Math.min(1.4, Math.max(0.7, r));
      return lengthMode === 'both' ? (1 + r) / 2 : r;
    }
    lengthModeEl.addEventListener('change', function () {
      lengthMode = ['fixed', 'adaptive', 'both'].indexOf(lengthModeEl.value) >= 0 ? lengthModeEl.value : 'fixed';
      updateUI(); saveState();
    });

    // ========== Calculations / UI ==========
    function getStepLength() { return customStepLength !== null ? customStepLength : (height / 100) * 0.415; }
    function calculateCalories(km) { return Math.round(km * weight * 0.75); }

    function updateUI() {
      const stepLen = getStepLength();
      const avgRatio = steps > 0 ? ratioSum / steps : 1;
      const distanceKm = (steps * stepLen * avgRatio) / 1000;
      const progress = Math.min((steps / dailyGoal) * 100, 100);
      stepsEl.textContent = steps.toLocaleString();
      distanceEl.innerHTML = distanceKm.toFixed(2) + ' <span style="font-size:0.7rem; font-weight:600;">km</span>';
      $('distanceM').textContent = Math.round(steps * stepLen * avgRatio).toLocaleString() + ' m';
      caloriesEl.textContent = calculateCalories(distanceKm).toLocaleString();
      stepLengthEl.textContent = (stepLen * avgRatio).toFixed(2);
      progressPercent.textContent = Math.round(progress) + '%';
      goalPercentEl.textContent = Math.round(progress) + '%';
      progressCircle.style.strokeDashoffset = CIRCUMFERENCE - (progress / 100) * CIRCUMFERENCE;
      if (customStepLength !== null) {
        const p = activeProfileId != null ? profiles.find(function (x) { return String(x.id) === String(activeProfileId); }) : null;
        baseSampleBox.textContent = t('baseOn', { name: p ? (p.name + ' (' + p.stepLength.toFixed(3) + ' m)') : (customStepLength.toFixed(3) + ' m') });
        baseSampleBox.classList.add('on');
      } else {
        baseSampleBox.textContent = t('baseOff');
        baseSampleBox.classList.remove('on');
      }
    }

    function refreshToggle() {
      btnToggle.textContent = isCounting ? t('stop') : t('startCounting');
      btnToggle.className = isCounting ? 'btn-danger' : 'btn-dark';
    }

    let calibMsg = { key: 'calibReady', vars: null, cls: '', raw: null };
    function setCalib(key, vars, cls, extra) {
      calibMsg = { key: key, vars: vars, cls: cls || '', extra: extra || null };
      renderCalib();
    }
    function renderCalib() {
      let s = t(calibMsg.key, calibMsg.vars);
      if (calibMsg.extra) s += ' • ' + t('stepsPerMin', { c: calibMsg.extra });
      calibStatus.textContent = s;
      calibStatus.className = 'calib-status' + (calibMsg.cls ? ' ' + calibMsg.cls : '');
    }

    // ========== Collapsible / settings ==========
    document.querySelectorAll('[data-toggle]').forEach(function (header) {
      header.addEventListener('click', function () {
        $(header.getAttribute('data-toggle')).classList.toggle('open');
        header.querySelector('.arrow').classList.toggle('open');
      });
    });
    function closeContents(except) {
      [aboutContent, tutorialContent, reminderContent, batteryContent].forEach(function (el) {
        if (el !== except) el.classList.remove('open');
      });
    }
    function closeSettings() { settingsOverlay.classList.remove('open'); closeContents(null); }
    btnGear.addEventListener('click', function () { settingsOverlay.classList.add('open'); });
    btnCloseSettings.addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', function (e) { if (e.target === settingsOverlay) closeSettings(); });
    function bindPanel(btnId, el) {
      $(btnId).addEventListener('click', function () { el.classList.toggle('open'); closeContents(el); });
    }
    bindPanel('btnAbout', aboutContent);
    bindPanel('btnTutorial', tutorialContent);
    bindPanel('btnReminder', reminderContent);
    bindPanel('btnBattery', batteryContent);
    $('btnBattery').hidden = !NATIVE_V2 || typeof NATIVE.openBatterySettings !== 'function';
    $('btnOpenBattery').addEventListener('click', function () { try { NATIVE.openBatterySettings(); } catch (e) {} });

    // ========== Day roll ==========
    function todayKey() { return new Date().toDateString(); }
    let dayKey = todayKey();
    function rollDay() {
      const k = todayKey();
      if (k !== dayKey) { dayKey = k; steps = 0; ratioSum = 0; return true; }
      return false;
    }
    setInterval(function () { if (rollDay()) { updateUI(); saveNow(); } }, 15000);

    // ========== Main counter ==========
    const counterSub = {
      onSteps: function (n, ts, before) {
        rollDay();
        trackCadence(ts, n);
        const add = Math.max(0, n - (before || 0));     // steps made before midnight belong to yesterday
        if (add > 0) { steps += add; ratioSum += add * lengthRatio(cadenceNow()); }
        updateUI(); saveState();
      },
      onFail: function () { stopCounting(); }
    };
    function startCounting() {
      if (isCounting) return;
      isCounting = true;
      refreshToggle();
      Engine.start(counterSub);
      saveState();
    }
    function stopCounting() {
      const was = isCounting;
      isCounting = false;
      refreshToggle();
      Engine.stop(counterSub);
      if (was) saveState();
    }
    btnToggle.addEventListener('click', function () { if (isCounting) stopCounting(); else startCounting(); });
    btnReset.addEventListener('click', function () {
      if (confirm(t('confirmReset'))) { steps = 0; ratioSum = 0; updateUI(); saveNow(); }
    });

    // ========== Sample ==========
    const sampleSub = {
      onSteps: function (n, ts) {
        sampleSteps += n;
        const now = performance.now();
        const ok = ts && ts.length && ts.length === n;
        const t0 = ok ? ts[0] : now, t1 = ok ? ts[ts.length - 1] : now;
        if (sampleFirst === null) sampleFirst = t0;
        sampleLast = t1;
      },
      onFail: function () { cancelSample(); }
    };
    function cancelSample() {
      isSampling = false;
      Engine.stop(sampleSub);
      btnSampleStart.disabled = false;
      btnSampleStop.disabled = true;
      setCalib('calibReady', null, '');
    }
    btnSampleStart.addEventListener('click', function () {
      if (isSampling) return;
      sampleDistance = parseFloat(latinDigits(sampleDistanceInput.value));
      if (!isFinite(sampleDistance) || sampleDistance < 1 || sampleDistance > 100) { alert(t('invalidDistance')); return; }
      isSampling = true;
      sampleSteps = 0; sampleFirst = sampleLast = null; lastSampleCadence = null; lastSampleLength = null;
      btnSampleStart.disabled = true; btnSampleStop.disabled = false;
      setCalib('sampleWalking', { d: sampleDistance }, 'active');
      Engine.start(sampleSub);
    });
    btnSampleStop.addEventListener('click', function () {
      if (!isSampling) return;
      if (Engine.isNative()) Engine.poll();       // collect the last steps before stopping
      isSampling = false;
      Engine.stop(sampleSub);
      btnSampleStart.disabled = false; btnSampleStop.disabled = true;
      if (sampleSteps < 5) { setCalib('tooFew', null, ''); return; }
      const len = sampleDistance / sampleSteps;
      if (len < 0.2 || len > 1.6) { setCalib('wrongResult', { n: sampleSteps }, ''); return; }
      lastSampleLength = len;
      lastSampleCadence = null;
      if (sampleFirst !== null && sampleLast - sampleFirst >= 3000 && sampleSteps >= 8) {
        const c = (sampleSteps - 1) / (sampleLast - sampleFirst) * 60000;
        if (c >= 40 && c <= 220) lastSampleCadence = c;
      }
      setCalib('sampleDone', { n: sampleSteps, len: lastSampleLength.toFixed(3) }, 'done',
               lastSampleCadence ? Math.round(lastSampleCadence) : null);
      updateUI(); saveState();
    });
    btnSaveSample.addEventListener('click', function () {
      if (lastSampleLength === null) { alert(t('needSample')); return; }
      const name = sampleNameInput.value.trim();
      if (!name) { alert(t('needName')); return; }
      profiles.push({
        id: Date.now(), name: name, stepLength: lastSampleLength, distance: sampleDistance,
        steps: sampleSteps, cadence: lastSampleCadence, date: new Date().toLocaleDateString()
      });
      sampleNameInput.value = '';
      renderProfiles(); updateUI(); saveNow();
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function renderProfiles() {
      if (profiles.length === 0) {
        profileListEl.innerHTML = '<div class="empty">' + escapeHtml(t('noSamples')) + '</div>';
        return;
      }
      profileListEl.innerHTML = profiles.map(function (p) {
        const pid = Number(p.id);
        const act = String(pid) === String(activeProfileId);
        return '<div class="profile-item' + (act ? ' active' : '') + '" data-id="' + pid + '">' +
          '<div style="flex:1;min-width:0;">' +
          '<div class="name">' + escapeHtml(p.name) + (act ? ' ' + escapeHtml(t('activeTag')) : '') + '</div>' +
          '<div class="meta">' + p.stepLength.toFixed(3) + ' m • ' + escapeHtml(p.date) + '</div></div>' +
          '<div class="profile-actions">' +
          '<button type="button" class="btn-use-sample' + (act ? ' active-use' : '') + '" data-action="use" data-id="' + pid + '">' +
          escapeHtml(act ? t('using') : t('useSample')) + '</button>' +
          '<button type="button" class="btn-danger btn-del-sample" data-action="del" data-id="' + pid + '">✕</button>' +
          '</div></div>';
      }).join('');
    }
    function useProfile(id) {
      id = Number(id);
      const p = profiles.find(function (x) { return x.id === id; });
      if (!p) return;
      if (String(activeProfileId) === String(id)) { activeProfileId = null; customStepLength = null; }
      else { activeProfileId = id; customStepLength = p.stepLength; }
      updateUI(); renderProfiles(); saveNow();
    }
    function deleteProfile(id) {
      id = Number(id);
      if (!confirm(t('confirmDelete'))) return;
      profiles = profiles.filter(function (x) { return x.id !== id; });
      if (String(activeProfileId) === String(id)) { activeProfileId = null; customStepLength = null; }
      renderProfiles(); updateUI(); saveNow();
    }
    profileListEl.addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      e.preventDefault(); e.stopPropagation();
      if (btn.getAttribute('data-action') === 'use') useProfile(btn.getAttribute('data-id'));
      else deleteProfile(btn.getAttribute('data-id'));
    });
    baseSampleBox.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (activeProfileId != null) useProfile(activeProfileId);
      else if (profiles.length > 0) useProfile(profiles[profiles.length - 1].id);
      else if (customStepLength != null) { customStepLength = null; updateUI(); saveState(); }
    });

    // ========== Inputs ==========
    function clamp(v, lo, hi, def) {
      v = Number(v);
      if (!isFinite(v)) return def;
      return Math.min(hi, Math.max(lo, v));
    }
    heightInput.addEventListener('input', function () { height = clamp(heightInput.value, 100, 230, 170); updateUI(); saveState(); });
    weightInput.addEventListener('input', function () { weight = clamp(weightInput.value, 30, 200, 70); updateUI(); saveState(); });
    goalInput.addEventListener('input', function () { dailyGoal = Math.round(clamp(goalInput.value, 1000, 50000, 8000)); updateUI(); saveState(); });
    // show the corrected value inside the field once the user finishes typing
    heightInput.addEventListener('change', function () { height = clamp(heightInput.value, 100, 230, 170); heightInput.value = height; updateUI(); saveNow(); });
    weightInput.addEventListener('change', function () { weight = clamp(weightInput.value, 30, 200, 70); weightInput.value = weight; updateUI(); saveNow(); });
    goalInput.addEventListener('change', function () { dailyGoal = Math.round(clamp(goalInput.value, 1000, 50000, 8000)); goalInput.value = dailyGoal; updateUI(); saveNow(); });
    // Persian/Arabic digits -> 0-9 so the field always shows and reads English numbers
    function latinDigits(s) {
      return String(s).replace(/[\u06F0-\u06F9]/g, function (c) { return c.charCodeAt(0) - 0x06F0; })
                      .replace(/[\u0660-\u0669]/g, function (c) { return c.charCodeAt(0) - 0x0660; })
                      .replace(/\u066B/g, '.').replace(/,/g, '.');
    }
    sampleDistanceInput.addEventListener('change', function () {
      sampleDistanceInput.value = clamp(latinDigits(sampleDistanceInput.value), 1, 100, 10);
    });

    // ========== Save / load (throttled) ==========
    let saveTimer = null;
    function saveState() { if (!saveTimer) saveTimer = setTimeout(saveNow, 1500); }
    function saveNow() {
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      safeSet('stepCounterV8', JSON.stringify({
        steps: steps, ratioSum: ratioSum, lengthMode: lengthMode, height: height, weight: weight, dailyGoal: dailyGoal,
        customStepLength: customStepLength, profiles: profiles, activeProfileId: activeProfileId,
        vertFilter: vertFilter.value, horizFilter: horizFilter.value, sensitivity: sensitivity.value,
        counting: isCounting, date: new Date().toDateString()
      }));
      if (NATIVE_V2 && typeof NATIVE.setProgress === 'function') { try { NATIVE.setProgress(steps, dailyGoal); } catch (e) {} }
    }
    window.addEventListener('pagehide', saveNow);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { saveNow(); }
      else { rollDay(); Engine.poll(); updateUI(); if (!NATIVE_V2) checkWebReminder(); }
    });

    let savedCounting = false;
    function loadState() {
      let data = null;
      try {
        const saved = safeGet('stepCounterV8') || safeGet('stepCounterV7');
        if (saved) data = JSON.parse(saved);
      } catch (e) { data = null; }
      if (data && typeof data === 'object') {
        const sameDay = data.date === new Date().toDateString();
        if (sameDay) steps = Math.max(0, Math.floor(Number(data.steps)) || 0);
        const rs = Number(data.ratioSum);
        ratioSum = (sameDay && isFinite(rs) && rs >= steps * 0.7 && rs <= steps * 1.4) ? rs : steps;
        lengthMode = ['fixed', 'adaptive', 'both'].indexOf(data.lengthMode) >= 0 ? data.lengthMode : 'fixed';
        lengthModeEl.value = lengthMode;
        height = clamp(data.height, 100, 230, 170);
        weight = clamp(data.weight, 30, 200, 70);
        dailyGoal = Math.round(clamp(data.dailyGoal, 1000, 50000, 8000));
        profiles = (Array.isArray(data.profiles) ? data.profiles : []).filter(function (p) {
          return p && isFinite(Number(p.id)) && isFinite(Number(p.stepLength)) &&
                 Number(p.stepLength) >= 0.2 && Number(p.stepLength) <= 1.6;
        }).map(function (p) {
          return {
            id: Number(p.id), name: String(p.name == null ? '' : p.name).slice(0, 40),
            stepLength: Number(p.stepLength), distance: Number(p.distance) || 0, steps: Number(p.steps) || 0,
            date: String(p.date == null ? '' : p.date).slice(0, 30),
            cadence: (isFinite(Number(p.cadence)) && Number(p.cadence) >= 40 && Number(p.cadence) <= 220) ? Number(p.cadence) : null
          };
        });
        const act = profiles.find(function (x) { return String(x.id) === String(data.activeProfileId); });
        activeProfileId = act ? act.id : null;
        customStepLength = act ? act.stepLength : null;
        heightInput.value = height; weightInput.value = weight; goalInput.value = dailyGoal;
        vertFilter.value = clamp(data.vertFilter, 0, 100, 50);
        horizFilter.value = clamp(data.horizFilter, 0, 100, 40);
        sensitivity.value = clamp(data.sensitivity, 0, 100, 60);
        savedCounting = data.counting === true;
      }
      updateFilterLabels();
    }

    // ========== Motion filter ==========
    function updateFilterLabels() {
      $('vertVal').textContent = vertFilter.value;
      $('horizVal').textContent = horizFilter.value;
      $('sensVal').textContent = sensitivity.value;
      [vertFilter, horizFilter, sensitivity].forEach(function (el) {
        const pct = el.value;
        el.style.background = 'linear-gradient(to right, var(--fill) 0%, var(--fill) ' + pct + '%, var(--track) ' + pct + '%, var(--track) 100%)';
      });
    }
    [vertFilter, horizFilter, sensitivity].forEach(function (el) {
      el.addEventListener('input', function () { updateFilterLabels(); Engine.pushParams(); saveState(); });
    });
    $('btnResetFilters').addEventListener('click', function () {
      vertFilter.value = 50; horizFilter.value = 40; sensitivity.value = 60;
      updateFilterLabels(); Engine.pushParams(); saveNow();
    });

    // ========== Dark mode ==========
    let isDark = safeGet('stepDark') === '1';
    function applyDark() {
      document.body.classList.toggle('dark', isDark);
      document.documentElement.classList.toggle('dark', isDark);
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', isDark ? '#0f172a' : '#e5e7eb');
      $('darkLabel').textContent = t('dark');
      $('darkStatus').textContent = isDark ? t('on') : t('off');
    }
    $('btnDarkMode').addEventListener('click', function () {
      isDark = !isDark;
      safeSet('stepDark', isDark ? '1' : '0');
      applyDark();
    });

    // ========== Daily reminder ==========
    const reminderTime = $('reminderTime');
    let reminderTimer = null;
    // ----- reminder time picker: hour / minute (+AM/PM) selects, 24 h or 12 h -----
    const rtHour = $('rtHour'), rtMin = $('rtMin'), rtAmPm = $('rtAmPm'), rtFmt = $('rtFmt');
    let timeFmt = safeGet('stepTimeFmt') === '12' ? '12' : '24';
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function fillSelect(sel, from, to, keepPad) {
      sel.innerHTML = '';
      for (let i = from; i <= to; i++) {
        const o = document.createElement('option');
        o.value = String(i); o.textContent = keepPad ? pad2(i) : String(i);
        sel.appendChild(o);
      }
    }
    function showTime(hhmm) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
      let h = m ? Math.min(23, +m[1]) : 20, mi = m ? Math.min(59, +m[2]) : 0;
      rtFmt.value = timeFmt;
      if (timeFmt === '12') {
        fillSelect(rtHour, 1, 12, false);
        rtHour.value = String(h % 12 === 0 ? 12 : h % 12);
        rtAmPm.hidden = false; rtAmPm.value = h >= 12 ? 'PM' : 'AM';
      } else {
        fillSelect(rtHour, 0, 23, true);
        rtHour.value = String(h);
        rtAmPm.hidden = true;
      }
      fillSelect(rtMin, 0, 59, true);
      rtMin.value = String(mi);
      reminderTime.value = pad2(h) + ':' + pad2(mi);
    }
    function readTime() {
      let h = +rtHour.value; const mi = +rtMin.value;
      if (timeFmt === '12') h = (h % 12) + (rtAmPm.value === 'PM' ? 12 : 0);
      reminderTime.value = pad2(h) + ':' + pad2(mi);
    }
    [rtHour, rtMin, rtAmPm].forEach(function (el) { el.addEventListener('change', readTime); });
    rtFmt.addEventListener('change', function () {
      const cur = reminderTime.value;
      timeFmt = rtFmt.value === '12' ? '12' : '24';
      safeSet('stepTimeFmt', timeFmt);
      showTime(cur);
    });

    function reminderBodyTemplate() { return t('reminderBody'); }
    function fillBody(s) { return s.replace('{steps}', steps.toLocaleString()).replace('{goal}', dailyGoal.toLocaleString()); }

    function nativeReminder(time) {
      if (!NATIVE_V2 || typeof NATIVE.setReminder !== 'function') return null;
      try { return String(NATIVE.setReminder(time, t('title'), reminderBodyTemplate())); } catch (e) { return 'error'; }
    }
    function showInPageReminder(text) {
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
      const old = document.getElementById('reminderBanner');
      if (old) old.remove();
      const d = document.createElement('div');
      d.id = 'reminderBanner';
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;padding:16px 14px;background:#1e40af;' +
        'color:#fff;font-weight:700;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:0.95rem;';
      d.textContent = t('title') + ' — ' + text;
      d.addEventListener('click', function () { d.remove(); });
      document.body.appendChild(d);
      setTimeout(function () { if (d.parentNode) d.remove(); }, 30000);
    }
    function fireWebReminder() {
      const text = fillBody(reminderBodyTemplate());
      let shown = false;
      try {
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          new Notification(t('title'), { body: text });
          shown = true;
        }
      } catch (e) { shown = false; }
      if (!shown) showInPageReminder(text);
    }
    // fires when the time has come (up to 60 min late, e.g. the app was opened right after the time), once per day
    function checkWebReminder() {
      const ts = safeGet('stepReminder');
      const m = ts ? /^(\d{1,2}):(\d{2})$/.exec(ts) : null;
      if (!m) return;
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +m[1], +m[2], 0, 0);
      const late = (now.getTime() - target.getTime()) / 60000;
      if (late >= 0 && late < 60 && safeGet('stepReminderLast') !== now.toDateString()) {
        safeSet('stepReminderLast', now.toDateString());
        fireWebReminder();
      }
    }
    function scheduleWebReminder() {
      if (reminderTimer) clearInterval(reminderTimer);
      if (!safeGet('stepReminder')) return;
      reminderTimer = setInterval(checkWebReminder, 15000);
      checkWebReminder();
    }
    $('btnEnableReminder').addEventListener('click', async function () {
      const tm = reminderTime.value || '20:00';
      if (NATIVE_V2 && typeof NATIVE.setReminder === 'function') {
        const r = nativeReminder(tm);
        if (r === 'ok') { safeSet('stepReminder', tm); alert(t('reminderEnabled', { t: tm })); }
        else if (r === 'need_permission') { alert(t('reminderNeedPerm')); }
        else { alert(t('reminderUnsupported')); }
        return;
      }
      // no native reminder support: ask for notification permission if the browser has it, otherwise use the in-page reminder
      try {
        if (typeof Notification !== 'undefined' && Notification.permission === 'default') await Notification.requestPermission();
      } catch (e) {}
      safeSet('stepReminder', tm);
      safeDel('stepReminderLast');
      scheduleWebReminder();
      alert(t('reminderEnabled', { t: tm }) + '\n' + t('reminderNoteWeb'));
    });
    $('btnDisableReminder').addEventListener('click', function () {
      safeDel('stepReminder');
      if (reminderTimer) clearInterval(reminderTimer);
      if (NATIVE_V2 && typeof NATIVE.cancelReminder === 'function') { try { NATIVE.cancelReminder(); } catch (e) {} }
      alert(t('reminderDisabled'));
    });

    // ========== Apply language ==========
    function applyLang(code) {
      if (!I18N[code]) code = 'en';
      lang = code;
      const rtl = (code === 'fa' || code === 'he');
      document.documentElement.lang = code;
      document.documentElement.dir = rtl ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
      document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
      document.title = t('title');
      btnGear.title = btnGear.ariaLabel = t('settings');
      const header = code === 'fa' ? '' :
        '<div style="text-align:center;margin-bottom:14px;"><div class="about-by">' + escapeHtml(t('createdBy')) +
        '</div><div class="about-name">App Stone</div><div class="about-bar"></div></div>';
      aboutContent.innerHTML = header + t('about');
      tutorialContent.innerHTML = t('tutorial');
      $('footerBadge').textContent = NATIVE_V2 ? t('footerNative') : t('footerWeb');
      $('reminderNote').textContent = NATIVE_V2 ? t('reminderNoteNative') : t('reminderNoteWeb');
      applyDark();
      refreshToggle();
      renderCalib();
      renderProfiles();
      updateUI();
      safeSet('stepLang2', code);
      if (NATIVE_V2 && safeGet('stepReminder')) nativeReminder(safeGet('stepReminder'));   // refresh notification text language
    }
    langSelect.addEventListener('change', function () { applyLang(langSelect.value); });

    // ========== Init ==========
    loadState();
    const storedReminder = safeGet('stepReminder');
    showTime(storedReminder || '20:00');
    lang = safeGet('stepLang2') || 'en';
    if (!I18N[lang]) lang = 'en';
    langSelect.value = lang;
    applyLang(lang);
    if (!NATIVE_V2 && storedReminder) scheduleWebReminder();
    if (NATIVE_V2) { try { NATIVE.setProgress(steps, dailyGoal); } catch (e) {} }

    // restore the "counting" state after a reload (the Android service keeps running meanwhile)
    if (savedCounting && (NATIVE_V2 || typeof DeviceMotionEvent === 'undefined' ||
                          typeof DeviceMotionEvent.requestPermission !== 'function')) {
      autoStarting = true;
      startCounting();
      setTimeout(function () { autoStarting = false; }, 4000);
    }

    // free the splash after its animation (2 s + 0.5 s fade)
    setTimeout(function () { const s = document.getElementById('splash'); if (s && s.parentNode) s.parentNode.removeChild(s); }, 2800);

  </script>
</body>
